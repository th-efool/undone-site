<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" fill="none">
  <!-- Pressed Dried Herbarium Botanical Specimen -->
  <g filter="drop-shadow(0 2px 6px rgba(40, 30, 20, 0.22))">
    <!-- Main stem -->
    <path d="M 45 135 C 44 110, 48 80, 52 40 C 53 25, 50 10, 48 5" stroke="#4A3F2C" stroke-width="2.2" stroke-linecap="round"/>
    
    <!-- Secondary twigs -->
    <path d="M 47 105 C 38 98, 28 92, 22 90" stroke="#524632" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M 50 82 C 60 76, 72 72, 78 70" stroke="#524632" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M 51 60 C 40 52, 32 45, 26 40" stroke="#524632" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 52 38 C 62 30, 70 24, 75 20" stroke="#524632" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 50 20 C 44 15, 38 12, 34 8" stroke="#524632" stroke-width="1" stroke-linecap="round"/>

    <!-- Pressed Dried Leaves (Organic shapes with dried olive/brown tones) -->
    <!-- Bottom left leaf cluster -->
    <path d="M 22 90 C 14 85, 12 75, 18 72 C 24 70, 28 82, 22 90 Z" fill="#584C35" opacity="0.9"/>
    <path d="M 28 92 C 22 98, 16 102, 14 96 C 12 90, 22 88, 28 92 Z" fill="#63563D" opacity="0.85"/>

    <!-- Mid right leaf cluster -->
    <path d="M 78 70 C 86 64, 88 54, 82 52 C 76 50, 72 62, 78 70 Z" fill="#544833" opacity="0.9"/>
    <path d="M 72 72 C 78 78, 84 82, 86 76 C 88 70, 78 68, 72 72 Z" fill="#5F523A" opacity="0.85"/>

    <!-- Mid left leaf cluster -->
    <path d="M 26 40 C 18 36, 16 26, 22 24 C 28 22, 32 32, 26 40 Z" fill="#594D36" opacity="0.9"/>

    <!-- Upper right leaf cluster -->
    <path d="M 75 20 C 82 14, 82 6, 76 6 C 70 6, 68 14, 75 20 Z" fill="#5A4E37" opacity="0.9"/>

    <!-- Top tip leaf -->
    <path d="M 48 5 C 44 -2, 52 -2, 54 4 C 54 8, 50 10, 48 5 Z" fill="#6A5C41"/>

    <!-- Dried seed pods / buds -->
    <circle cx="20" cy="72" r="2.2" fill="#3E3424"/>
    <circle cx="83" cy="53" r="2.2" fill="#3E3424"/>
    <circle cx="23" cy="24" r="2" fill="#3E3424"/>
    <circle cx="76" cy="6" r="2" fill="#3E3424"/>
  </g>
</svg>
