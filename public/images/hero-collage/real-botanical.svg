<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" fill="none">
  <!-- Pressed Dried Meadow Flower Specimen (Herbarium) -->
  <g filter="drop-shadow(0 3px 8px rgba(45, 35, 25, 0.2))">
    <!-- Main slender botanical stems -->
    <path d="M 55 155 C 54 125, 58 95, 62 55 C 63 35, 60 18, 58 10" stroke="#7A684C" stroke-width="2.2" stroke-linecap="round"/>
    
    <!-- Delicate lateral branches -->
    <path d="M 57 120 C 44 112, 30 106, 22 102" stroke="#8E7C5D" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 60 92 C 72 84, 86 78, 96 74" stroke="#8E7C5D" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 61 68 C 48 58, 36 50, 28 44" stroke="#8E7C5D" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M 62 42 C 74 32, 84 24, 90 18" stroke="#8E7C5D" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M 59 22 C 50 16, 42 12, 36 7" stroke="#8E7C5D" stroke-width="1.1" stroke-linecap="round"/>

    <!-- Small side branchlets -->
    <path d="M 28 105 C 24 96, 20 90, 16 88" stroke="#9B8A6A" stroke-width="1" stroke-linecap="round"/>
    <path d="M 90 76 C 95 68, 98 62, 102 58" stroke="#9B8A6A" stroke-width="1" stroke-linecap="round"/>
    <path d="M 34 48 C 30 40, 26 34, 22 30" stroke="#9B8A6A" stroke-width="1" stroke-linecap="round"/>

    <!-- Pressed Dried Meadow Flower Heads / Seed Pods (Golden-tan dried herbarium clusters) -->
    <!-- Lower left cluster -->
    <ellipse cx="20" cy="102" rx="4.5" ry="3.5" fill="#B5A07E" opacity="0.95"/>
    <ellipse cx="15" cy="88" rx="4" ry="3" fill="#A89270" opacity="0.9"/>
    <circle cx="23" cy="95" r="2.5" fill="#8E7856"/>

    <!-- Mid right cluster -->
    <ellipse cx="97" cy="73" rx="5" ry="3.8" fill="#BBA786" opacity="0.95"/>
    <ellipse cx="103" cy="58" rx="4.2" ry="3.2" fill="#AD9876" opacity="0.9"/>
    <circle cx="91" cy="67" r="2.5" fill="#887352"/>

    <!-- Upper left cluster -->
    <ellipse cx="27" cy="43" rx="4.5" ry="3.5" fill="#B8A381" opacity="0.95"/>
    <ellipse cx="21" cy="30" rx="3.8" ry="3" fill="#A48E6C" opacity="0.9"/>

    <!-- Upper right cluster -->
    <ellipse cx="91" cy="17" rx="4.5" ry="3.5" fill="#BAA583" opacity="0.95"/>
    <circle cx="83" cy="22" r="2.5" fill="#8F7A59"/>

    <!-- Top flower tip -->
    <ellipse cx="58" cy="8" rx="4" ry="3.2" fill="#B5A07E"/>
    <circle cx="56" cy="14" r="2.2" fill="#7E6A4B"/>

    <!-- Pressed dried leaflets along stem -->
    <path d="M 56 135 C 50 132, 46 128, 48 124 C 52 122, 56 128, 56 135 Z" fill="#998666" opacity="0.85"/>
    <path d="M 60 110 C 66 106, 70 102, 68 98 C 64 96, 60 102, 60 110 Z" fill="#998666" opacity="0.85"/>
    <path d="M 58 80 C 52 76, 48 72, 50 68 C 54 66, 58 72, 58 80 Z" fill="#998666" opacity="0.85"/>
  </g>
</svg>
