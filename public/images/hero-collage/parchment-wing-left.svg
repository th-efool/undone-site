<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 320" fill="none">
  <defs>
    <filter id="parchment-shadow-pwl" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="2" dy="5" stdDeviation="8" flood-color="#141E38" flood-opacity="0.14" />
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#141E38" flood-opacity="0.08" />
    </filter>
    <linearGradient id="parchment-grad-pwl" x1="0" y1="0" x2="220" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCF8F0" />
      <stop offset="50%" stop-color="#F3E9D7" />
      <stop offset="100%" stop-color="#E8DCB7" />
    </linearGradient>
  </defs>
  <!-- Organic curved parchment scrap with realistic deckle edge -->
  <path d="M 0 10
           C 25 15, 60 5, 95 18
           C 130 32, 160 22, 185 45
           C 205 65, 215 95, 208 125
           C 200 155, 218 185, 205 215
           C 192 245, 175 268, 150 288
           C 125 308, 90 310, 60 318
           C 30 324, 10 315, 0 310
           Z"
        fill="url(#parchment-grad-pwl)"
        filter="url(#parchment-shadow-pwl)" />
  <!-- Delicate white fibrous deckle highlight -->
  <path d="M 0 10
           C 25 15, 60 5, 95 18
           C 130 32, 160 22, 185 45
           C 205 65, 215 95, 208 125
           C 200 155, 218 185, 205 215
           C 192 245, 175 268, 150 288
           C 125 308, 90 310, 60 318
           C 30 324, 10 315, 0 310"
        stroke="#FFFDF9"
        stroke-width="1.8"
        stroke-linecap="round"
        opacity="0.85" />
</svg>
