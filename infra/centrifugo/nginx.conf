# Production Nginx reverse-proxy configuration for Centrifugo v6.10.0
# Enforces TLS termination, WebSocket upgrades, long read timeouts for pings,
# and strictly blocks internal/administrative routes from public ingress.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream centrifugo_backend {
    server 127.0.0.1:8000;
    keepalive 64;
}

server {
    listen 80;
    server_name realtime.undone.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name realtime.undone.local;

    ssl_certificate     /etc/ssl/certs/realtime.crt;
    ssl_certificate_key /etc/ssl/private/realtime.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Public WebSocket listener: upgrades, timeouts, and headers
    location /connection/websocket {
        proxy_pass http://centrifugo_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep proxy timeout longer than 25s ping interval
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    # Strict isolation: Block internal APIs, health, and metrics from public internet
    location /api/ {
        return 403 '{"error": "Forbidden", "message": "Access to private Centrifugo API is forbidden"}';
        add_header Content-Type application/json always;
    }

    location /metrics {
        return 403 'Forbidden';
    }

    location /health {
        return 403 'Forbidden';
    }

    location /admin {
        return 403 'Forbidden';
    }

    location /debug {
        return 403 'Forbidden';
    }

    # Default fallback
    location / {
        return 404 'Not Found';
    }
}
