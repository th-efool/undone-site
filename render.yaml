# render.yaml
# Place this at the root of your repo. Render reads it on deploy.
# This defines your two services: the main Next.js web app + the background vectorization worker.

services:
  - name: undone-web
    type: web
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 24.13.0
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        sync: false

  - name: undone-worker
    type: worker
    env: node
    plan: starter          # Sponsor track: use free/starter as provided
    buildCommand: npm install
    startCommand: npx tsx src/server/worker.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WORKER_SECRET
        sync: false

  # Independent PostgreSQL polling worker; the existing vector worker is unchanged.
  - name: sidequest-creation-worker
    type: worker
    env: node
    plan: starter
    buildCommand: npm ci --include=dev && npx prisma generate
    startCommand: npm run creation:worker
    envVars:
      - key: NODE_VERSION
        value: 24.13.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: COHORT_AI_MODEL
        value: gemini-3.5-flash-lite
