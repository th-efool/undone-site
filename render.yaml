# render.yaml
# Place this at the root of your repo. Render reads it on deploy.
# This defines your two services: the main Next.js web app + the background vectorization worker.

services:
  - name: sidequesthq-web
    type: web
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        sync: false

  - name: sidequesthq-worker
    type: worker
    env: node
    plan: starter          # Sponsor track: use free/starter as provided
    buildCommand: npm install && npm run build:worker
    startCommand: npm run start:worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WORKER_SECRET
        sync: false
