version: '3.8'

services:
  centrifugo:
    image: centrifugo/centrifugo:v6.10.0
    container_name: centrifugo
    restart: unless-stopped
    command: centrifugo -c /centrifugo/config.json
    volumes:
      - ./centrifugo.config.json:/centrifugo/config.json:ro
    ports:
      - "8000:8000"
    environment:
      - CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY=${CENTRIFUGO_TOKEN_HMAC_SECRET_KEY:-replace_with_random_32_character_secret_for_jwt}
      - CENTRIFUGO_HTTP_API_KEY=${CENTRIFUGO_API_KEY:-replace_with_random_server_api_key}
      - CENTRIFUGO_PROXY_SUBSCRIBE_HTTP_STATIC_HEADERS_X_CENTRIFUGO_PROXY_KEY=${CENTRIFUGO_PROXY_STATIC_KEY:-replace_with_random_proxy_callback_static_key}
      - CENTRIFUGO_PROXY_SUB_REFRESH_HTTP_STATIC_HEADERS_X_CENTRIFUGO_PROXY_KEY=${CENTRIFUGO_PROXY_STATIC_KEY:-replace_with_random_proxy_callback_static_key}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
