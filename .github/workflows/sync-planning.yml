name: Sync planning branch

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: planning-branch-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out planning
        uses: actions/checkout@v4
        with:
          ref: planning
          fetch-depth: 0

          submodules: false

      - name: Merge master into planning
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master planning
          if git merge-base --is-ancestor origin/master HEAD; then
            echo "planning already contains master"
            exit 0
          fi
          planning_head="$(git rev-parse HEAD)"
          git merge --no-commit --no-ff origin/master || true

          if git status --porcelain | grep -E "^(UU|AA) .gitmodules"; then
            git checkout origin/master -- .gitmodules || git checkout HEAD -- .gitmodules
          fi

          git restore --source="$planning_head" --staged --worktree -- \
            plans \
            artifacts \
            _archived \
            assets/playstore-listing \
            "assets/ChatGPT Image Aug 11, 2026, 12_24_28 PM.png" \
            MEMORY || true

          git checkout --theirs . || true
          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "chore(planning): sync master into planning [skip ci]"
            git push origin HEAD:planning
          else
            echo "No changes after merge resolution"
          fi
