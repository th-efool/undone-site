name: Sync planning branch

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: planning-branch-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out planning
        uses: actions/checkout@v4
        with:
          ref: planning
          fetch-depth: 0

      - name: Merge master into planning
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master planning
          git merge --no-edit origin/master
          git push origin HEAD:planning
