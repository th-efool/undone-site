<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <title>Scenario 2: GitHub Connect Modal Regression Fixture</title>
  <style>
    /* Baseline CSS Cascade representation: unlayered reset vs layered utilities */
    * {
      box-sizing: border-box;
      min-width: 0;
      margin: 0;
      padding: 0; /* UNLAYERED RESET: outranks @layer utilities */
    }
    button {
      background: none; /* UNLAYERED RESET: outranks @layer utilities */
      border: 0;
      cursor: pointer;
      font: inherit;
      color: inherit;
    }
    /* forms.css unlayered input defaults */
    input, select {
      width: 100%;
      height: 2.75rem;
      padding-inline: 1rem; /* 16px left + 16px right */
      font: inherit;
    }
    input[type="checkbox"] {
      width: 1.1rem;
      height: 1.1rem;
      /* Notice: padding-inline is NOT cleared! */
    }

    /* Layered utilities from Tailwind v4 */
    @layer utilities {
      .p-6 {
        padding: 1.5rem; /* Defect 1: defeated by unlayered * { padding: 0 } */
      }
      .space-y-4 > * + * {
        margin-top: 1rem;
      }
      .bg-zinc-900 {
        background-color: #18181b; /* Defect 2: defeated by unlayered button { background: none } */
      }
      .text-white {
        color: #ffffff;
      }
      .px-4 {
        padding-left: 1rem;
        padding-right: 1rem;
      }
      .py-2\.5 {
        padding-top: 0.625rem;
        padding-bottom: 0.625rem;
      }
      .rounded-xl {
        border-radius: 0.75rem;
      }
      .w-full {
        width: 100%;
      }
      .flex {
        display: flex;
      }
      .items-center {
        align-items: center;
      }
      .justify-center {
        justify-content: center;
      }
      .gap-2 {
        gap: 0.5rem;
      }
    }
  </style>
</head>
<body style="background: #09090b; color: #f4f4f5; min-height: 100vh; display: grid; place-items: center;">
  <!-- Scenario 2: GitHub Connect Modal Fixture -->
  <div data-testid="connect-modal" style="width: 480px; background: #18181b; border: 1px solid #27272a; border-radius: 1rem;">
    <!-- Defect 1: form with p-6 receives 0px padding due to unlayered * { padding: 0 } -->
    <form class="p-6 space-y-4" data-testid="connect-modal-form">
      <h3 style="font-size: 1.125rem; font-weight: 600;">Connect GitHub Repository</h3>

      <!-- Defect 2: button with bg-zinc-900 receives transparent background and 0px padding from unlayered reset -->
      <button
        type="button"
        class="w-full py-2.5 px-4 bg-zinc-900 text-white rounded-xl flex items-center justify-center gap-2"
        data-testid="btn-oauth-connect"
      >
        <span>Connect with GitHub (1-Click)</span>
      </button>

      <div>
        <label for="repo-name" style="font-size: 0.75rem; font-weight: 600; display: block; margin-bottom: 0.25rem;">Repository Name</label>
        <input
          id="repo-name"
          data-testid="input-repo-name"
          type="text"
          value="octocat/undone-notes"
        />
      </div>

      <div>
        <label for="github-token" style="font-size: 0.75rem; font-weight: 600; display: block; margin-bottom: 0.25rem;">Personal Access Token</label>
        <input
          id="github-token"
          data-testid="input-pat-token"
          type="password"
          placeholder="ghp_..."
        />
      </div>

      <!-- Defect 3: Checkbox inflated to 36px wide by inherited padding-inline: 1rem -->
      <div style="display: flex; align-items: center; gap: 0.5rem;">
        <input
          id="allow-public-repo"
          data-testid="checkbox-allow-public"
          type="checkbox"
        />
        <label for="allow-public-repo" style="font-size: 0.75rem;">Allow Public Repository</label>
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1rem;">
        <button
          type="button"
          data-testid="btn-close"
          class="px-4 py-2 bg-zinc-900 text-white rounded-xl"
        >
          Close
        </button>
        <button
          type="submit"
          data-testid="btn-connect"
          class="px-4 py-2 bg-zinc-900 text-white rounded-xl"
        >
          Connect
        </button>
      </div>
    </form>
  </div>
</body>
</html>
